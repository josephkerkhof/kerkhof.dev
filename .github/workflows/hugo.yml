name: Deploy Hugo site to Cloudflare

on:
  # Releases are deployed only when a tag is pushed.
  push:
    tags: ["*"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "production"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      HUGO_VERSION: 0.165.0
      WRANGLER_VERSION: 4.129.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
      - name: Verify changelog entry
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          grep -Fq "## [$version] - " CHANGELOG.md
      - name: Resolve release identifier
        run: echo "HUGO_PARAMS_RELEASE=$(git describe --tags --always --dirty)" >> "$GITHUB_ENV"
      - name: Verify LFS media
        run: bash ./scripts/r2-media.sh check
      - name: Install Wrangler CLI
        run: npm install --global wrangler@${WRANGLER_VERSION}
      - name: Sync media to R2
        run: bash ./scripts/r2-media.sh sync
      - name: Build with Hugo
        env:
          # For maximum backward compatibility with Hugo modules
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --minify
      - name: Verify production media URLs
        run: bash ./scripts/r2-media.sh verify-public
      - name: Remove R2 media from Worker assets
        run: bash ./scripts/r2-media.sh prune-public
      - name: Deploy Worker static assets
        run: wrangler deploy
