<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Joseph Kerkhof</title>
  <desc id="description">Grayscale profile portrait of Joseph Kerkhof.</desc>
  <defs>
    <filter id="profile-treatment" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="1.05" intercept="-0.025"/>
        <feFuncG type="linear" slope="1.05" intercept="-0.025"/>
        <feFuncB type="linear" slope="1.05" intercept="-0.025"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <image href="profile.webp" x="0" y="-315" width="1200" height="1200" filter="url(#profile-treatment)"/>
</svg>
