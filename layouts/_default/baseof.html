<!doctype html>
<html lang="{{ .Site.Language.Lang }}">
  {{ partial "head.html" . }}
  <body{{ if .IsHome }} class="home"{{ end }}>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="application-frame">
      <div class="document-frame">
        {{ partial "header.html" . }}
        {{ block "main" . }}{{ end }}
        {{ partial "footer.html" . }}
      </div>
      {{ partial "scroll-rail.html" . }}
    </div>
  </body>
</html>
