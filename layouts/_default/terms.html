{{ define "main" }}
<main id="main-content" class="shell page-shell">
  <header class="page-header">
    <p class="eyebrow">Index</p>
    <h1>{{ .Title }}</h1>
  </header>
  <div class="tag-index">
    {{ range .Data.Terms.ByCount }}
    <a href="{{ .Page.RelPermalink }}"
      ><span>{{ .Page.LinkTitle }}</span><strong>{{ .Count }}</strong></a
    >
    {{ end }}
  </div>
</main>
{{ end }}
