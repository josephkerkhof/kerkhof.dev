<aside
  class="scroll-rail"
  aria-label="Document scroll controls"
  data-scroll-rail
>
  <button
    class="scroll-step scroll-step--up"
    type="button"
    data-scroll-up
    aria-label="Scroll up"
    disabled
  >
    &#9650;
  </button>
  <div class="scroll-track" data-scroll-track>
    <div
      class="scroll-thumb"
      role="scrollbar"
      aria-label="Document position"
      aria-controls="main-content"
      aria-orientation="vertical"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="0"
      tabindex="0"
      data-scroll-thumb
    ></div>
  </div>
  <button
    class="scroll-step scroll-step--down"
    type="button"
    data-scroll-down
    aria-label="Scroll down"
    disabled
  >
    &#9660;
  </button>
</aside>
