<footer class="site-footer shell">
  <div class="colophon">
    <p>&copy; {{ now.Format "2006" }} {{ .Site.Title }}</p>
    <nav aria-label="Social links">
      <ul class="social-links">
        {{ range .Site.Params.social }}
        <li><a href="{{ .url }}" rel="me">{{ .name }}</a></li>
        {{ end }}
      </ul>
    </nav>
  </div>
</footer>
{{ if not hugo.IsServer }} {{ with site.Config.Services.GoogleAnalytics.ID }}{{
template "_internal/google_analytics.html" $ }}{{ end }} {{ end }}
