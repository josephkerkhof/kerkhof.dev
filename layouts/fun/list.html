{{ define "main" }}
<main id="main-content" class="shell page-shell fun-page">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
    {{ with .Description }}
    <p class="lede">{{ . }}</p>
    {{ end }}
  </header>

  <div class="sitemap fun-index window window--wide">
    <div class="window-titlebar">go on. click it. you know you want to.</div>
    <div class="window-body">
      {{ partial "fun-tree.html" (dict "page" . "root" true) }}
    </div>
  </div>
</main>
{{ end }}
